<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Service Center</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h1>Регистрация</h1>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="login">👤 Логин</label>
                    <input type="text" id="login" name="login"
                           data-validate="login" autocomplete="username">
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">🔒 Пароль</label>
                    <input type="password" id="password" name="password"
                           data-validate="password" autocomplete="new-password">
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="full_name">📝 ФИО</label>
                    <input type="text" id="full_name" name="full_name"
                           data-validate="full_name">
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="phone">📞 Телефон</label>
                    <input type="tel" id="phone" name="phone"
                           data-validate="phone" placeholder="+7(999)123-45-67">
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="email">✉️ Email</label>
                    <input type="email" id="email" name="email"
                           data-validate="email">
                    <div class="error-message"></div>
                </div>

                <button type="submit" class="btn btn-block">✅ Зарегистрироваться</button>
            </form>

            <p class="auth-switch">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>

    <script src="js/validation.js"></script>
</body>
</html>
