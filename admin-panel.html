<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Service Center</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <header class="header">
        <div class="logo">Service Center / Админ</div>
        <div>
            <span style="font-size:14px;">Привет, <b id="userName">—</b></span>
            <button id="logoutBtn">🚪 Выйти</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>📊 Все заявки</h2>

            <!-- Панель фильтров -->
            <div class="filters">
                <div class="filter-group">
                    <label for="filterSearch">🔍 Поиск</label>
                    <input type="text" id="filterSearch" placeholder="Название, ФИО или логин...">
                </div>
                <div class="filter-group">
                    <label for="filterStatus">Статус</label>
                    <select id="filterStatus">
                        <option value="">Все статусы</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterCategory">Категория</label>
                    <select id="filterCategory">
                        <option value="">Все категории</option>
                    </select>
                </div>
                <div class="filter-group filter-group-btn">
                    <button id="resetFilters" class="btn btn-secondary btn-sm">🔄 Сбросить</button>
                </div>
            </div>

            <!-- Таблица -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Пользователь</th>
                            <th>Заявка</th>
                            <th>Категория</th>
                            <th>Цена</th>
                            <th>Статус</th>
                            <th>Дата</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="8" class="empty">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div class="pagination-wrapper">
                <div class="pagination-info" id="paginationInfo"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
    <!-- Модальное окно истории -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📜 История заявки <span id="modalOrderId"></span></h3>
                <button class="modal-close" id="modalClose" aria-label="Закрыть">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="empty">Загрузка...</div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
